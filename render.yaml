# Render configuration for the backend (Node/Express + Firebase Admin)
services:
  - type: web
    name: whistle-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: |
      yarn install --frozen-lockfile
      yarn build
    startCommand: yarn start
    envVars:
      - key: PORT
        value: 4000
      # Firebase Admin credentials (base64-encoded service account JSON)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Firebase project ID (if needed)
      - key: FIREBASE_PROJECT_ID
        sync: false
      # JWT secret for issuing long-lived tokens
      - key: WHISTLE_JWT_SECRET
        sync: false
    healthCheckPath: /health
